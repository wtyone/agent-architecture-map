/* ====================== 层级切换 / 播放 ====================== */
function setDepth(d,fitAfter){
  d=Math.max(1,Math.min(LAYERS.length,d));
  const changed=d!==S.depth;
  if(changed){ S.nodeOff={}; S.edgeOff={}; }
  S.depth=d; render(changed);
  if(S.selected&&!S.graph.byId[S.selected]) closeDrawer(); else if(S.selected) openDrawer(S.selected);
  if(fitAfter) setTimeout(fit,changed?80:0);
}
let playing=null;
function stopPlay(){ clearInterval(playing); playing=null; refreshLabels(); }
function togglePlay(){
  if(playing) return stopPlay();
  if(S.depth>=LAYERS.length) setDepth(1,true);
  playing=setInterval(()=>{ if(S.depth>=LAYERS.length) return stopPlay(); setDepth(S.depth+1,true); },2500);
  refreshLabels();
}

/* ====================== 视图：平移 / 缩放 / 自适应 ====================== */
const viewport=$('viewport'), canvas=$('canvas');
let viewTween=null;
function applyView(){
  canvas.style.transform=`translate(${S.pan.x}px,${S.pan.y}px) scale(${S.scale})`;
  const g=22*S.scale; viewport.style.backgroundSize=`${g}px ${g}px`;
  viewport.style.backgroundPosition=`${S.pan.x}px ${S.pan.y}px`;
  $('zoomval').textContent=Math.round(S.scale*100)+'%';
}
const clampScale=s=>Math.min(2.4,Math.max(.2,s));
/* 以视口内 (mx,my) 为锚点缩放到 ns */
function zoomAt(ns,mx,my){ ns=clampScale(ns); const k=ns/S.scale;
  S.pan.x=mx-(mx-S.pan.x)*k; S.pan.y=my-(my-S.pan.y)*k; S.scale=ns; applyView(); }
function zoomBy(f){ if(viewTween) viewTween.cancel();
  const vw=viewport.clientWidth,vh=viewport.clientHeight, ns=clampScale(S.scale*f), k=ns/S.scale;
  tweenView({x:vw/2-(vw/2-S.pan.x)*k, y:vh/2-(vh/2-S.pan.y)*k}, ns, 200); }
function tweenView(tp,ts,dur=360){
  if(viewTween) viewTween.cancel();
  const f={x:S.pan.x,y:S.pan.y,s:S.scale};
  viewTween=tween(dur,e=>{ S.pan.x=f.x+(tp.x-f.x)*e; S.pan.y=f.y+(tp.y-f.y)*e; S.scale=f.s+(ts-f.s)*e; applyView(); });
}
function fit(){
  // 按布局终点算包围盒（层切换动画进行中也能一次对准）；用户拖动过的节点以当前位置为准
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9,any=false;
  for(const id in S.target){ any=true; const g=S.target[id], p=S.nodeOff[id]?S.pos[id]:g;
    minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x+g.w); maxY=Math.max(maxY,p.y+g.h); }
  if(!any) return;
  if(S.regionMode) S.regionRects.forEach(r=>{ minX=Math.min(minX,r.x); minY=Math.min(minY,r.y);
    maxX=Math.max(maxX,r.x+r.w); maxY=Math.max(maxY,r.y+r.h); });
  minX-=S.regionMode?60:110; maxX+=40; minY-=30; maxY+=30;       // 给左侧回环线与注释留白
  const capH=$('cap').offsetHeight+24;                            // 底部说明卡占用的高度
  const vw=viewport.clientWidth-(S.selected&&!isMobile()?$('drawer').offsetWidth:0), vh=viewport.clientHeight-capH;
  const ns=Math.min(1.4,Math.min(vw/(maxX-minX),vh/(maxY-minY)));
  tweenView({x:(vw-(maxX-minX)*ns)/2-minX*ns, y:(vh-(maxY-minY)*ns)/2-minY*ns}, ns);
}
function centerOn(id){ const b=S.box[id]; if(!b) return;
  // 桌面端避开右侧抽屉；手机端抽屉在底部，把节点放到上方可见区
  const cx=(viewport.clientWidth-(isMobile()?0:$('drawer').offsetWidth))/2;
  const cy=viewport.clientHeight*(isMobile()?.14:.5);
  const ns=Math.max(S.scale,.9); tweenView({x:cx-b.cx*ns, y:cy-b.cy*ns}, ns); }

viewport.addEventListener('wheel',e=>{
  e.preventDefault(); if(viewTween) viewTween.cancel();
  const r=viewport.getBoundingClientRect();
  // 按 delta 连续缩放（而非固定档位），滚轮与触控板捏合（ctrlKey）都更平滑
  const dy=e.deltaMode===1?e.deltaY*16:e.deltaMode===2?e.deltaY*400:e.deltaY;
  zoomAt(S.scale*Math.exp(-Math.max(-120,Math.min(120,dy))*(e.ctrlKey?.01:.0016)), e.clientX-r.left, e.clientY-r.top);
},{passive:false});

/* ====================== 指针交互：平移 / 双指缩放 / 拖节点 / 拖连线 ====================== */
const pts=new Map();      // 画布背景上的活动指针
let pan=null, pinch=null, ndrag=null, edrag=null;
const local=e=>{ const r=viewport.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };

viewport.addEventListener('pointerdown',e=>{
  if(e.button>0) return;
  const handle=e.target.closest('.eh'), node=e.target.closest('.node');
  if(handle&&!pts.size){ e.preventDefault(); const k=handle.dataset.ekey, ed=S.graph.edges.find(x=>ekey(x)===k), o=ed?edgeOffOf(ed):{dx:0,dy:0};
    edrag={id:e.pointerId,key:k,sx:e.clientX,sy:e.clientY,dx0:o.dx,dy0:o.dy}; return; }
  if(node&&!pts.size){ e.preventDefault(); const id=node.dataset.id, p=S.pos[id];
    ndrag={pid:e.pointerId,id,el:node,sx:e.clientX,sy:e.clientY,ox:p.x,oy:p.y,moved:false}; node.style.zIndex=20; return; }
  if(viewTween) viewTween.cancel();
  pts.set(e.pointerId,local(e));
  if(pts.size===1){ pan={sx:e.clientX,sy:e.clientY,px:S.pan.x,py:S.pan.y}; viewport.classList.add('grab'); }
  else if(pts.size===2){
    pan=null; viewport.classList.remove('grab');
    const [a,b]=[...pts.values()], m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    // 记住捏合中心对应的画布坐标，之后始终让它跟住两指中点
    pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1, s0:S.scale, cx:(m.x-S.pan.x)/S.scale, cy:(m.y-S.pan.y)/S.scale};
  }
});
window.addEventListener('pointermove',e=>{
  if(edrag&&e.pointerId===edrag.id){
    S.edgeOff[edrag.key]={dx:edrag.dx0+(e.clientX-edrag.sx)/S.scale, dy:edrag.dy0+(e.clientY-edrag.sy)/S.scale};
    drawEdges(); return; }
  if(ndrag&&e.pointerId===ndrag.pid){
    const dx=(e.clientX-ndrag.sx)/S.scale, dy=(e.clientY-ndrag.sy)/S.scale;
    if(!ndrag.moved&&Math.hypot(dx,dy)<4) return;
    ndrag.moved=true;
    const p=S.pos[ndrag.id]={x:ndrag.ox+dx,y:ndrag.oy+dy}; placeEl(ndrag.id);
    const b=S.box[ndrag.id]; if(b){ b.left=p.x; b.top=p.y; finishBox(b); S.nodeOff[ndrag.id]={dx:p.x-b.autoLeft,dy:p.y-b.autoTop}; }
    drawEdges(); return; }
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,local(e));
  if(pinch&&pts.size===2){
    const [a,b]=[...pts.values()], m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    S.scale=clampScale(pinch.s0*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d0);
    S.pan.x=m.x-pinch.cx*S.scale; S.pan.y=m.y-pinch.cy*S.scale; applyView();
  } else if(pan){ S.pan.x=pan.px+(e.clientX-pan.sx); S.pan.y=pan.py+(e.clientY-pan.sy); applyView(); }
});
function endPointer(e){
  if(edrag&&e.pointerId===edrag.id){
    const o=S.edgeOff[edrag.key];
    if(o&&Math.abs(o.dx)<6&&Math.abs(o.dy)<6){ delete S.edgeOff[edrag.key]; drawEdges(); }   // 拖回原处即复位
    edrag=null; return; }
  if(ndrag&&e.pointerId===ndrag.pid){
    ndrag.el.style.zIndex=''; if(!ndrag.moved&&e.type==='pointerup') openDrawer(ndrag.id); ndrag=null; return; }
  if(!pts.delete(e.pointerId)) return;
  pinch=null;
  if(pts.size===1){ const p=[...pts.values()][0], r=viewport.getBoundingClientRect();
    pan={sx:p.x+r.left,sy:p.y+r.top,px:S.pan.x,py:S.pan.y}; }
  else { pan=null; viewport.classList.remove('grab'); }
}
window.addEventListener('pointerup',endPointer);
window.addEventListener('pointercancel',endPointer);
/* 触摸点按节点后浏览器会补发合成 click，落在刚亮起的背板上会立刻关掉抽屉——在 touchend 上掐掉 */
nodesEl.addEventListener('touchend',e=>{ if(e.target.closest('.node')) e.preventDefault(); },{passive:false});

/* 悬停高亮邻域 */
nodesEl.addEventListener('pointerover',e=>{
  const el=e.target.closest('.node'); if(!el||ndrag||e.pointerType==='touch') return;
  S.hover=el.dataset.id;
  const nb=new Set([S.hover]);
  S.graph.edges.forEach(ed=>{ if(ed.from===S.hover) nb.add(ed.to); if(ed.to===S.hover) nb.add(ed.from); });
  nodesEl.classList.add('hovering'); nodeEls.forEach((n,id)=>n.classList.toggle('nb',nb.has(id)));
  drawEdges();
});
nodesEl.addEventListener('pointerout',e=>{
  if(!S.hover||(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.node'))) return;
  S.hover=null; nodesEl.classList.remove('hovering'); nodeEls.forEach(n=>n.classList.remove('nb')); drawEdges();
});
nodesEl.addEventListener('keydown',e=>{
  const el=e.target.closest('.node'); if(el&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); openDrawer(el.dataset.id); }
});

/* ====================== 详情抽屉 ====================== */
const drawer=$('drawer'), backdrop=$('backdrop'), rail=$('rail');
function openDrawer(id){
  const n=S.graph.byId[id]; if(!n) return;
  const meta=NODE_META[id], D=T('dom'), P=T('proc');
  S.selected=id;
  nodeEls.forEach((el,nid)=>el.classList.toggle('sel',nid===id));
  $('d_sw').style.background=`var(--d-${n.dom})`;
  $('d_title').innerHTML=tx(n.label);
  $('d_chips').innerHTML=
     `<span class="chip acc">${LAYERS[meta.layer].code} · ${tx(LAYERS[meta.layer].title)}</span>`
    +`<span class="chip"><i style="background:var(--d-${n.dom})"></i>${D[n.dom]}</span>`
    +`<span class="chip"><i style="background:var(--p-${n.proc})"></i>${P[n.proc]}</span>`;
  $('d_sub').style.display=n.sub?'':'none'; $('d_sub').innerHTML=n.sub?tx(n.sub):'';
  $('d_desc').innerHTML=tx(meta.d)||t('noDetail');
  const list=(pairs,box)=>{
    box.innerHTML=pairs.length?'':`<span class="empty">—</span>`;
    pairs.forEach(([nid,lbl])=>{ const m=S.graph.byId[nid]; if(!m) return;
      const b=document.createElement('button'); b.className='nrow';
      b.innerHTML=`<i style="background:var(--d-${m.dom})"></i><span>${tx(m.label)}</span>${lbl?`<small>${esc(tx(lbl))}</small>`:''}`;
      b.onclick=()=>{ openDrawer(nid); centerOn(nid); }; box.appendChild(b); });
  };
  list(S.graph.edges.filter(e=>e.to===id).map(e=>[e.from,e.label]),$('d_in'));
  list(S.graph.edges.filter(e=>e.from===id).map(e=>[e.to,e.label]),$('d_out'));
  drawer.classList.add('open'); drawer.setAttribute('aria-hidden','false');
  if(isMobile()) backdrop.classList.add('show');
  if(S.regionMode) drawEdges();
}
function closeDrawer(){
  drawer.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); S.selected=null;
  nodeEls.forEach(el=>el.classList.remove('sel'));
  if(!rail.classList.contains('open')) backdrop.classList.remove('show');
  if(S.regionMode) drawEdges();
}
$('d_close').onclick=closeDrawer;

/* ====================== 搜索 ====================== */
const qEl=$('q'), qInfo=$('qinfo');
function hay(n){ return [n.label,n.sub,n.d].flatMap(v=>v?[v.zh,v.en]:[]).join(' ').toLowerCase(); }
const HAY=Object.fromEntries(Object.values(NODE_META).map(n=>[n.id,hay(n)]));
const hit=id=>S.query&&HAY[id]&&HAY[id].includes(S.query);
function applyQuery(){ nodeEls.forEach((el,id)=>el.classList.toggle('match',!!hit(id))); }
function updateQueryInfo(){
  if(!S.query){ qInfo.textContent=''; return; }
  const inCur=[...nodeEls.keys()].filter(hit).length, total=Object.keys(HAY).filter(hit).length;
  qInfo.textContent=inCur?t('inCur',inCur):(total?t('deepHint',total):t('noMatch'));
}
qEl.addEventListener('input',()=>{ S.query=qEl.value.trim().toLowerCase(); applyQuery(); updateQueryInfo(); });
qEl.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ qEl.value=''; qEl.dispatchEvent(new Event('input')); qEl.blur(); return; }
  if(e.key!=='Enter'||!S.query) return;
  if(isMobile()) closeRail();
  const curHit=[...nodeEls.keys()].find(hit);
  if(curHit){ openDrawer(curHit); centerOn(curHit); return; }
  const deep=Object.values(NODE_META).find(n=>hit(n.id));
  if(deep){ setDepth(deep.layer+1,false); setTimeout(()=>{ openDrawer(deep.id); centerOn(deep.id); updateQueryInfo(); },500); }
});

/* ====================== 菜单 / 主题 / 语言 / 移动端层级栏 ====================== */
const menu=$('menu'), moreBtn=$('morebtn');
function setMenu(open){ menu.classList.toggle('open',open); moreBtn.setAttribute('aria-expanded',String(open)); }
moreBtn.onclick=e=>{ e.stopPropagation(); setMenu(!menu.classList.contains('open')); };
document.addEventListener('pointerdown',e=>{ if(!e.target.closest('.menuwrap')) setMenu(false); });
const menuAct=(id,fn,keep)=>{ $(id).onclick=()=>{ fn(); if(!keep) setMenu(false); }; };
menuAct('m_min',()=>setDepth(1,true));
menuAct('m_max',()=>setDepth(LAYERS.length,true));
menuAct('m_reset',resetLayout);
menuAct('m_anno',cycleAnno,true);
menuAct('m_edges',toggleEdgeView,true);
menuAct('m_legend',toggleLegend,true);
menuAct('m_theme',toggleTheme,true);

function resetLayout(){ S.nodeOff={}; S.edgeOff={}; render(true); setTimeout(fit,80); }
function cycleAnno(){ S.annoMode=(S.annoMode+1)%3; refreshLabels(); drawEdges(); }
function toggleEdgeView(){ S.edgeView=S.edgeView==='trunk'?'all':'trunk'; store.set('edges',S.edgeView); refreshLabels(); drawEdges(); }
function toggleLegend(){ $('legend').classList.toggle('show'); refreshLabels(); }
function setTheme(th,persist){ document.documentElement.dataset.theme=th; if(persist) store.set('theme',th); refreshLabels(); }
function toggleTheme(){ setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark',true); }
function setLang(l){
  if(l===S.lang) return; S.lang=l; store.set('lang',l);
  applyI18n(); render(false);
  if(S.regionMode) fit();                        // 全景区块宽度随文案长度变化
  if(S.selected) openDrawer(S.selected);
  updateQueryInfo();
}
$('themebtn').onclick=toggleTheme;
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{
  if(!store.get('theme')) setTheme(e.matches?'dark':'light',false); });

function openRail(){ rail.classList.add('open'); backdrop.classList.add('show'); }
function closeRail(){ rail.classList.remove('open'); if(!(drawer.classList.contains('open')&&isMobile())) backdrop.classList.remove('show'); }
$('railtoggle').onclick=()=>rail.classList.contains('open')?closeRail():openRail();
backdrop.onclick=()=>{ closeRail(); closeDrawer(); };
$('steps').addEventListener('click',e=>{ const s=e.target.closest('.step'); if(!s) return;
  setDepth(+s.dataset.idx+1,true); if(isMobile()) closeRail(); });

$('next').onclick=()=>setDepth(S.depth+1,true);
$('prev').onclick=()=>setDepth(S.depth-1,true);
$('play').onclick=togglePlay;
$('zin').onclick=()=>zoomBy(1.2);
$('zout').onclick=()=>zoomBy(1/1.2);
$('fit').onclick=fit;

/* ====================== 键盘 ====================== */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key;
  if(k==='ArrowRight') setDepth(S.depth+1,true);
  else if(k==='ArrowLeft') setDepth(S.depth-1,true);
  else if(k==='Home') setDepth(1,true);
  else if(k==='End') setDepth(LAYERS.length,true);
  else if(k==='f'||k==='F') fit();
  else if(k==='r'||k==='R') resetLayout();
  else if(k==='l'||k==='L') toggleLegend();
  else if(k===' '&&!e.target.closest('button,.node')){ e.preventDefault(); togglePlay(); }
  else if(k==='Escape'){ setMenu(false); closeRail(); closeDrawer(); }
  else if(k==='/'){ e.preventDefault(); if(isMobile()) openRail(); qEl.focus(); }
  else if(k==='+'||k==='=') zoomBy(1.2);
  else if(k==='-') zoomBy(1/1.2);
});

/* ====================== 启动 ====================== */
(function boot(){
  applyI18n();
  const fromHash=LAYERS.findIndex(L=>'#'+L.code===location.hash);
  S.depth=0; setDepth(fromHash>=0?fromHash+1:1,false);
  applyView(); setTimeout(fit,60);
  let rt; window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(fit,120); });
})();
</script>
</body>
</html>
